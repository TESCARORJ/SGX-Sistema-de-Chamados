name: Apply Sprint 9 checklist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sprint9-checklist-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-checklist:
    if: github.event.pull_request.head.ref == 'agent/sprint-9-checklist-incidentes'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout da branch da PR
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configurar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Aplicar checklist e documentacao
        run: python .github/scripts/apply_sprint9_checklist.py

      - name: Otimizar representacao do checklist no SeedData
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/SGX.SistemaChamado.Infrastructure/Persistence/Seed/SeedData.cs')
          raw = path.read_bytes()
          has_bom = raw.startswith(b'\xef\xbb\xbf')
          text = raw.decode('utf-8-sig')

          pattern = re.compile(
              r'^[ \t]*new \{ Id = Guid\.Parse\("([^"]+)"\), '
              r'RoadmapItemId = RoadmapItsmItem17Id, Titulo = "([^"]+)", '
              r'Descricao = "Sprint 9 Gerenciamento de Incidentes", '
              r'Grupo = GrupoRoadmapChecklist\.([A-Za-z]+), Ordem = (\d+), '
              r'Concluido = (true|false),.*$\n?',
              re.MULTILINE,
          )
          matches = list(pattern.finditer(text))
          if len(matches) != 59:
              raise SystemExit(f'Esperados 59 itens detalhados da Sprint 9; encontrados {len(matches)}.')

          orders = [int(match.group(4)) for match in matches]
          if orders != list(range(1, 60)):
              raise SystemExit(f'Ordenacao invalida da Sprint 9: {orders}')

          tuple_lines = []
          for match in matches:
              item_id, title, group, order, completed = match.groups()
              tuple_lines.append(
                  f'            (Guid.Parse("{item_id}"), "{title}", '
                  f'GrupoRoadmapChecklist.{group}, {completed}),' 
              )

          first_start = matches[0].start()
          last_end = matches[-1].end()
          text = text[:first_start] + '        .. CriarChecklistSprint9GerenciamentoIncidentes(),\n' + text[last_end:]

          helper_name = 'CriarChecklistSprint9GerenciamentoIncidentes'
          if f'private static object[] {helper_name}()' in text:
              raise SystemExit('Helper da Sprint 9 ja existe antes da otimizacao.')

          field_start = text.index('public static readonly object[] RoadmapChecklistItens')
          field_end = text.index('\n    ];', field_start) + len('\n    ];')
          helper = f'''\n\n    private static object[] {helper_name}()\n    {{\n        var itens = new (Guid Id, string Titulo, GrupoRoadmapChecklist Grupo, bool Concluido)[]\n        {{\n{chr(10).join(tuple_lines)}\n        }};\n\n        return itens\n            .Select((item, index) => (object)new\n            {{\n                item.Id,\n                RoadmapItemId = RoadmapItsmItem17Id,\n                item.Titulo,\n                Descricao = "Sprint 9 Gerenciamento de Incidentes",\n                item.Grupo,\n                Ordem = index + 1,\n                item.Concluido,\n                Obrigatorio = true,\n                Ativo = true,\n                CriadoEm = DataBase,\n                CriadoPor = UsuarioSistema,\n                AtualizadoEm = item.Concluido ? DataBase : (DateTime?)null,\n                AtualizadoPor = item.Concluido ? UsuarioSistema : null\n            }})\n            .ToArray();\n    }}'''
          text = text[:field_end] + helper + text[field_end:]

          encoding = 'utf-8-sig' if has_bom else 'utf-8'
          path.write_text(text, encoding=encoding, newline='\n')
          print('SeedData otimizado com helper tipado para os 59 itens da Sprint 9.')

      - name: Restaurar dependencias
        run: dotnet restore SGX.SistemaChamado.sln

      - name: Build preparatorio da API para gerar migration
        id: build_preparatorio
        shell: bash
        run: |
          set +e
          timeout 1800s dotnet build src/SGX.SistemaChamado.Api/SGX.SistemaChamado.Api.csproj --no-restore -m:1 -v:minimal /p:RunAnalyzers=false /p:RunAnalyzersDuringBuild=false > build-preparatorio.log 2>&1
          status=$?
          echo "$status" > build-preparatorio.status
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 80 build-preparatorio.log || true
          exit 0

      - name: Publicar log do build preparatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sprint9-build-preparatorio
          path: |
            build-preparatorio.log
            build-preparatorio.status
          retention-days: 1

      - name: Validar resultado do build preparatorio
        shell: bash
        run: |
          status=$(cat build-preparatorio.status)
          if [ "$status" -eq 124 ]; then
            echo "Build preparatorio excedeu 1800 segundos."
            exit 124
          fi
          if [ "$status" -ne 0 ]; then
            echo "Build preparatorio falhou com status $status."
            exit "$status"
          fi
          echo "Build preparatorio concluido com sucesso."

      - name: Instalar dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 9.0.0

      - name: Gerar migration somente de checklist e dados
        run: >-
          dotnet ef migrations add AtualizarChecklistSprint9GerenciamentoIncidentes
          -p src/SGX.SistemaChamado.Infrastructure
          -s src/SGX.SistemaChamado.Api
          --no-build

      - name: Validar que a migration nao possui alteracao estrutural
        shell: python
        run: |
          from pathlib import Path

          migration_dir = Path('src/SGX.SistemaChamado.Infrastructure/Persistence/Migrations')
          candidates = sorted(
              path for path in migration_dir.glob('*_AtualizarChecklistSprint9GerenciamentoIncidentes.cs')
              if not path.name.endswith('.Designer.cs')
          )
          if len(candidates) != 1:
              raise SystemExit(f'Esperada uma migration da Sprint 9; encontradas {len(candidates)}.')

          content = candidates[0].read_text(encoding='utf-8-sig')
          if 'UpdateData(' not in content:
              raise SystemExit('A migration nao contem UpdateData.')

          forbidden = (
              'CreateTable(', 'DropTable(', 'AddColumn<', 'DropColumn(', 'AlterColumn<',
              'CreateIndex(', 'DropIndex(', 'AddForeignKey(', 'DropForeignKey(',
              'RenameColumn(', 'RenameTable('
          )
          found = [token for token in forbidden if token in content]
          if found:
              raise SystemExit(f'Migration estrutural detectada: {found}')

          print(f'Migration de dados validada: {candidates[0]}')

      - name: Testes direcionados RoadmapSprint9
        run: dotnet test tests/SGX.SistemaChamado.Tests /p:UseSharedCompilation=false -m:1 --filter "FullyQualifiedName~RoadmapSprint9"

      - name: Suite completa sem rebuild
        run: dotnet test SGX.SistemaChamado.sln /p:UseSharedCompilation=false -m:1 --no-build

      - name: Build backend obrigatorio
        run: dotnet build SGX.SistemaChamado.sln /p:UseSharedCompilation=false

      - name: Verificar EF pending model changes
        run: >-
          dotnet ef migrations has-pending-model-changes
          -p src/SGX.SistemaChamado.Infrastructure
          -s src/SGX.SistemaChamado.Api
          --no-build

      - name: Remover arquivos temporarios da automacao
        run: |
          rm .github/scripts/apply_sprint9_checklist.py
          rm .github/workflows/apply-sprint9-checklist.yml
          rm .github/sprint9-trigger.txt

      - name: Commitar alteracoes validadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/SGX.SistemaChamado.Infrastructure/Persistence/Seed/SeedData.cs \
            src/SGX.SistemaChamado.Infrastructure/Persistence/Migrations \
            tests/SGX.SistemaChamado.Tests/RoadmapSprint9GerenciamentoIncidentesChecklistTests.cs \
            docs/ROADMAP.md \
            docs/ROADMAP-ITSM.md \
            docs/roadmap/sprint-9-gerenciamento-incidentes.md \
            .github/scripts/apply_sprint9_checklist.py \
            .github/workflows/apply-sprint9-checklist.yml \
            .github/sprint9-trigger.txt
          git commit -m "docs: detalhar checklist da Sprint 9"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
