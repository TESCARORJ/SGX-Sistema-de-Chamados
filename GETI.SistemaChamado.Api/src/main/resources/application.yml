spring:
  application:
    name: GETI.SistemaChamado.Api
  profiles:
    group:
      local:
        - development
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  ambiente: local
  api:
    expor-endpoints-tecnicos: false
  cors:
    origens-permitidas: ${APP_CORS_ORIGENS_PERMITIDAS:}
  admin-local:
    habilitado: ${APP_ADMIN_LOCAL_HABILITADO:false}
    autenticacao-habilitada: ${APP_ADMIN_LOCAL_AUTENTICACAO_HABILITADA:false}
    nome: ${APP_ADMIN_LOCAL_NOME:Administrador Local}
    email: ${APP_ADMIN_LOCAL_EMAIL:admin.local@crea-rj.org.br}
    senha-inicial: ${APP_ADMIN_LOCAL_SENHA_INICIAL:}
  seguranca:
    modo-local-habilitado: false
    local:
      header-login: X-Auth-Login
      header-nome: X-Auth-Nome
      header-email: X-Auth-Email

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    br.geti.sistemachamado: INFO

AdminLocal:
  Nome: ${APP_ADMIN_LOCAL_NOME:Administrador Local}
  Email: ${APP_ADMIN_LOCAL_EMAIL:admin.local@crea-rj.org.br}
  SenhaInicial: ${APP_ADMIN_LOCAL_SENHA_INICIAL:}
