spring:
  application:
    name: GETI.SistemaChamado.Api
  profiles:
    group:
      local:
        - development
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  ambiente: local
  seguranca:
    modo-local-habilitado: false
    local:
      header-login: X-Auth-Login
      header-nome: X-Auth-Nome
      header-email: X-Auth-Email

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    br.geti.sistemachamado: INFO
