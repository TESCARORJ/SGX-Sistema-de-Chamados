spring:
  application:
    name: GETI.SistemaChamado.Worker.Email
  profiles:
    group:
      local:
        - development
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  ambiente: local
  worker:
    email:
      intervalo-processamento-ms: 60000
      modo-local-habilitado: false
      diretorio-arquivos-eml: data/worker-email/eml
      imap:
        host: ${APP_WORKER_EMAIL_IMAP_HOST:}
        porta: ${APP_WORKER_EMAIL_IMAP_PORTA:993}
        usuario: ${APP_WORKER_EMAIL_IMAP_USUARIO:}
        senha: ${APP_WORKER_EMAIL_IMAP_SENHA:}
        pasta: ${APP_WORKER_EMAIL_IMAP_PASTA:INBOX}
        ssl-habilitado: ${APP_WORKER_EMAIL_IMAP_SSL_HABILITADO:true}
        tls-habilitado: ${APP_WORKER_EMAIL_IMAP_TLS_HABILITADO:true}
        timeout-millis: ${APP_WORKER_EMAIL_IMAP_TIMEOUT_MILLIS:30000}
        connect-timeout-millis: ${APP_WORKER_EMAIL_IMAP_CONNECT_TIMEOUT_MILLIS:30000}
        max-mensagens-por-ciclo: ${APP_WORKER_EMAIL_IMAP_MAX_MENSAGENS_POR_CICLO:50}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO
    br.geti.sistemachamado: INFO
